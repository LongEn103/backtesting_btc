<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Strategy Backtester</title>
  <style>
    :root {
      --bg: #101413;
      --panel: #171d1b;
      --panel-2: #1e2723;
      --line: #304139;
      --line-soft: #24302b;
      --text: #edf5ef;
      --muted: #98aaa1;
      --green: #55d387;
      --red: #ff6b6b;
      --gold: #f5c45f;
      --cyan: #64d7e8;
      --blue: #7aa8ff;
      --shadow: 0 18px 48px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(85, 211, 135, .13), transparent 30%),
        linear-gradient(135deg, #0f1413 0%, #151b19 58%, #111615 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    aside {
      min-height: 100vh;
      padding: 22px;
      border-right: 1px solid var(--line);
      background: rgba(18, 24, 22, .92);
      position: sticky;
      top: 0;
      overflow-y: auto;
    }

    main {
      padding: 24px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #55d387, #64d7e8);
      color: #0b1110;
      font-weight: 900;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: 20px;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .section {
      border-top: 1px solid var(--line-soft);
      padding-top: 18px;
      margin-top: 18px;
    }

    .section h2 {
      font-size: 13px;
      color: #dce9e2;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 12px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
    }

    input, select {
      width: 100%;
      color: var(--text);
      background: #0f1513;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(85, 211, 135, .12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 6px;
      color: #09100e;
      background: var(--green);
      padding: 11px 12px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .16s ease, opacity .16s ease, background .16s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); opacity: .88; }

    .icon-btn {
      display: grid;
      place-items: center;
      background: #26332e;
      color: var(--text);
      font-size: 18px;
    }

    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 700;
    }

    .file-input {
      display: block;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      cursor: pointer;
    }

    .file-input input {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .topbar h2 {
      font-size: 28px;
      line-height: 1.05;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric {
      background: rgba(23, 29, 27, .88);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 13px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .metric strong {
      font-size: 22px;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .gold { color: var(--gold); }
    .cyan { color: var(--cyan); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }

    .chart-shell, .table-shell, .notes {
      background: rgba(23, 29, 27, .88);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .shell-head {
      min-height: 48px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .shell-head h3 {
      font-size: 14px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 480px;
      background: #0d1211;
    }

    .side-stack {
      display: grid;
      gap: 16px;
    }

    .notes {
      padding-bottom: 12px;
    }

    .notes ul {
      list-style: none;
      padding: 0 14px;
      margin: 0;
      display: grid;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .notes li {
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 9px;
    }

    .notes li:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .table-wrap {
      overflow: auto;
      max-height: 430px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      font-size: 13px;
    }

    th, td {
      text-align: right;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line-soft);
      white-space: nowrap;
    }

    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      background: #141a18;
      position: sticky;
      top: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 24px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 12px;
    }

    .buy { color: #0c1511; background: var(--green); }
    .sell { color: #160b0b; background: var(--red); }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1180px) {
      .metrics { grid-template-columns: repeat(3, 1fr); }
      .workspace { grid-template-columns: 1fr; }
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; min-height: auto; }
      main { padding: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .status { text-align: left; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      canvas { height: 380px; }
    }

    @media (max-width: 520px) {
      .row, .metrics { grid-template-columns: 1fr; }
      .shell-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="mark">₿</div>
        <div>
          <h1>加密货币策略回测</h1>
          <p class="subtitle">MA + RSI + 风控模拟器</p>
        </div>
      </div>

      <div class="section">
        <h2>数据</h2>
        <label class="file-input">
          <input id="csvFile" type="file" accept=".csv,text/csv" />
          导入 CSV：date, open, high, low, close, volume
        </label>
        <div class="actions">
          <button id="sampleBtn" class="ghost" type="button">使用内置 BTC 数据</button>
          <button id="downloadBtn" class="icon-btn" title="下载交易记录" type="button">↓</button>
        </div>
      </div>

      <div class="section">
        <h2>策略</h2>
        <div class="field">
          <label for="strategy">模式</label>
          <select id="strategy">
            <option value="maRsi">均线交叉 + RSI 过滤</option>
            <option value="breakout">唐奇安突破 + 趋势过滤</option>
            <option value="mean">RSI 均值回归</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="fast">快线 / 短周期</label>
            <input id="fast" type="number" min="2" value="12" />
          </div>
          <div class="field">
            <label for="slow">慢线 / 长周期</label>
            <input id="slow" type="number" min="3" value="48" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="rsiPeriod">RSI 周期</label>
            <input id="rsiPeriod" type="number" min="2" value="14" />
          </div>
          <div class="field">
            <label for="rsiBuy">RSI 入场阈值</label>
            <input id="rsiBuy" type="number" min="1" max="99" value="55" />
          </div>
        </div>
      </div>

      <div class="section">
        <h2>资金与成本</h2>
        <div class="row">
          <div class="field">
            <label for="capital">初始资金 USDT</label>
            <input id="capital" type="number" min="100" value="10000" />
          </div>
          <div class="field">
            <label for="risk">单次仓位 %</label>
            <input id="risk" type="number" min="1" max="100" value="95" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="fee">手续费 %</label>
            <input id="fee" type="number" min="0" step="0.01" value="0.10" />
          </div>
          <div class="field">
            <label for="slippage">滑点 %</label>
            <input id="slippage" type="number" min="0" step="0.01" value="0.05" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="stop">止损 %</label>
            <input id="stop" type="number" min="0" step="0.1" value="8" />
          </div>
          <div class="field">
            <label for="take">止盈 %</label>
            <input id="take" type="number" min="0" step="0.1" value="18" />
          </div>
        </div>
        <button id="runBtn" type="button">运行回测</button>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h2>BTC/USDT 策略实验台</h2>
          <p class="subtitle">本工具为教学与研究用途，不构成投资建议。</p>
        </div>
        <div id="status" class="status">已载入内置样本，等待回测。</div>
      </div>

      <section class="metrics">
        <div class="metric"><span>最终权益</span><strong id="mEquity">-</strong></div>
        <div class="metric"><span>总收益</span><strong id="mReturn">-</strong></div>
        <div class="metric"><span>最大回撤</span><strong id="mDrawdown">-</strong></div>
        <div class="metric"><span>胜率</span><strong id="mWin">-</strong></div>
        <div class="metric"><span>交易次数</span><strong id="mTrades">-</strong></div>
        <div class="metric"><span>买入持有</span><strong id="mHold">-</strong></div>
      </section>

      <div class="workspace">
        <section class="chart-shell">
          <div class="shell-head">
            <h3>价格、信号与权益曲线</h3>
            <div class="legend">
              <span><i class="dot" style="background:var(--cyan)"></i>价格</span>
              <span><i class="dot" style="background:var(--gold)"></i>快线</span>
              <span><i class="dot" style="background:var(--blue)"></i>慢线</span>
              <span><i class="dot" style="background:var(--green)"></i>权益</span>
            </div>
          </div>
          <canvas id="chart" width="1200" height="520"></canvas>
        </section>

        <div class="side-stack">
          <section class="notes">
            <div class="shell-head"><h3>策略说明</h3></div>
            <ul id="strategyNotes"></ul>
          </section>
          <section class="notes">
            <div class="shell-head"><h3>最新信号</h3></div>
            <ul id="signalNotes"></ul>
          </section>
        </div>
      </div>

      <section class="table-shell" style="margin-top:16px">
        <div class="shell-head">
          <h3>交易记录</h3>
          <button id="clearBtn" class="ghost" type="button">清空导入</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>动作</th>
                <th>价格</th>
                <th>数量 BTC</th>
                <th>现金</th>
                <th>权益</th>
                <th>单笔收益</th>
              </tr>
            </thead>
            <tbody id="tradeBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const els = {
      csvFile: document.getElementById('csvFile'),
      sampleBtn: document.getElementById('sampleBtn'),
      downloadBtn: document.getElementById('downloadBtn'),
      runBtn: document.getElementById('runBtn'),
      clearBtn: document.getElementById('clearBtn'),
      status: document.getElementById('status'),
      chart: document.getElementById('chart'),
      tradeBody: document.getElementById('tradeBody'),
      strategyNotes: document.getElementById('strategyNotes'),
      signalNotes: document.getElementById('signalNotes'),
      strategy: document.getElementById('strategy'),
      fast: document.getElementById('fast'),
      slow: document.getElementById('slow'),
      rsiPeriod: document.getElementById('rsiPeriod'),
      rsiBuy: document.getElementById('rsiBuy'),
      capital: document.getElementById('capital'),
      risk: document.getElementById('risk'),
      fee: document.getElementById('fee'),
      slippage: document.getElementById('slippage'),
      stop: document.getElementById('stop'),
      take: document.getElementById('take'),
      mEquity: document.getElementById('mEquity'),
      mReturn: document.getElementById('mReturn'),
      mDrawdown: document.getElementById('mDrawdown'),
      mWin: document.getElementById('mWin'),
      mTrades: document.getElementById('mTrades'),
      mHold: document.getElementById('mHold')
    };

    let candles = makeSampleData();
    let lastResult = null;

    function fmtUsd(v) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v);
    }

    function fmtPct(v) {
      return `${v >= 0 ? '+' : ''}${v.toFixed(2)}%`;
    }

    function fmtNum(v, digits = 4) {
      return Number(v).toLocaleString('en-US', { maximumFractionDigits: digits });
    }

    function makeSampleData() {
      const out = [];
      const start = new Date('2022-01-01T00:00:00Z');
      let price = 46200;
      for (let i = 0; i < 860; i++) {
        const cycle = Math.sin(i / 32) * 0.018 + Math.sin(i / 91) * 0.012;
        const shock = Math.sin(i * 1.7) * 0.006 + Math.cos(i / 13) * 0.009;
        const drift = i < 310 ? -0.0008 : i < 590 ? 0.0012 : -0.00015;
        price = Math.max(7000, price * (1 + cycle + shock + drift));
        const open = price * (1 + Math.sin(i / 7) * 0.004);
        const close = price;
        const high = Math.max(open, close) * (1 + 0.012 + Math.abs(Math.sin(i / 11)) * 0.018);
        const low = Math.min(open, close) * (1 - 0.012 - Math.abs(Math.cos(i / 17)) * 0.016);
        const date = new Date(start);
        date.setUTCDate(start.getUTCDate() + i);
        out.push({
          date: date.toISOString().slice(0, 10),
          open,
          high,
          low,
          close,
          volume: 18000 + Math.abs(Math.sin(i / 9)) * 12000
        });
      }
      return out;
    }

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      const header = lines.shift().split(',').map(x => x.trim().toLowerCase());
      const pick = name => header.indexOf(name);
      const dateIdx = pick('date') >= 0 ? pick('date') : 0;
      const openIdx = pick('open') >= 0 ? pick('open') : 1;
      const highIdx = pick('high') >= 0 ? pick('high') : 2;
      const lowIdx = pick('low') >= 0 ? pick('low') : 3;
      const closeIdx = pick('close') >= 0 ? pick('close') : 4;
      const volumeIdx = pick('volume') >= 0 ? pick('volume') : 5;
      return lines.map(line => {
        const cells = line.split(',').map(x => x.trim());
        return {
          date: cells[dateIdx],
          open: Number(cells[openIdx]),
          high: Number(cells[highIdx]),
          low: Number(cells[lowIdx]),
          close: Number(cells[closeIdx]),
          volume: Number(cells[volumeIdx] || 0)
        };
      }).filter(x => x.date && Number.isFinite(x.close)).sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    function sma(values, period) {
      const out = Array(values.length).fill(null);
      let sum = 0;
      for (let i = 0; i < values.length; i++) {
        sum += values[i];
        if (i >= period) sum -= values[i - period];
        if (i >= period - 1) out[i] = sum / period;
      }
      return out;
    }

    function rsi(values, period) {
      const out = Array(values.length).fill(null);
      let gain = 0;
      let loss = 0;
      for (let i = 1; i < values.length; i++) {
        const change = values[i] - values[i - 1];
        const up = Math.max(change, 0);
        const down = Math.max(-change, 0);
        if (i <= period) {
          gain += up;
          loss += down;
          if (i === period) {
            gain /= period;
            loss /= period;
            out[i] = 100 - (100 / (1 + gain / Math.max(loss, 1e-9)));
          }
        } else {
          gain = (gain * (period - 1) + up) / period;
          loss = (loss * (period - 1) + down) / period;
          out[i] = 100 - (100 / (1 + gain / Math.max(loss, 1e-9)));
        }
      }
      return out;
    }

    function highest(values, period, i) {
      let max = -Infinity;
      for (let j = Math.max(0, i - period); j < i; j++) max = Math.max(max, values[j]);
      return max;
    }

    function lowest(values, period, i) {
      let min = Infinity;
      for (let j = Math.max(0, i - period); j < i; j++) min = Math.min(min, values[j]);
      return min;
    }

    function getParams() {
      return {
        strategy: els.strategy.value,
        fast: Math.max(2, Number(els.fast.value)),
        slow: Math.max(3, Number(els.slow.value)),
        rsiPeriod: Math.max(2, Number(els.rsiPeriod.value)),
        rsiBuy: Number(els.rsiBuy.value),
        capital: Math.max(100, Number(els.capital.value)),
        risk: Math.min(100, Math.max(1, Number(els.risk.value))) / 100,
        fee: Math.max(0, Number(els.fee.value)) / 100,
        slippage: Math.max(0, Number(els.slippage.value)) / 100,
        stop: Math.max(0, Number(els.stop.value)) / 100,
        take: Math.max(0, Number(els.take.value)) / 100
      };
    }

    function signalAt(i, closes, highs, lows, fastMa, slowMa, rsiVals, p, inPosition, entryPrice) {
      const price = closes[i];
      if (inPosition) {
        if (p.stop && price <= entryPrice * (1 - p.stop)) return 'sell';
        if (p.take && price >= entryPrice * (1 + p.take)) return 'sell';
      }
      if (p.strategy === 'maRsi') {
        const crossUp = fastMa[i - 1] <= slowMa[i - 1] && fastMa[i] > slowMa[i];
        const crossDown = fastMa[i - 1] >= slowMa[i - 1] && fastMa[i] < slowMa[i];
        if (!inPosition && crossUp && rsiVals[i] >= p.rsiBuy) return 'buy';
        if (inPosition && (crossDown || rsiVals[i] < 45)) return 'sell';
      }
      if (p.strategy === 'breakout') {
        const upper = highest(highs, p.fast, i);
        const lower = lowest(lows, p.fast, i);
        if (!inPosition && price > upper && fastMa[i] > slowMa[i]) return 'buy';
        if (inPosition && (price < lower || fastMa[i] < slowMa[i])) return 'sell';
      }
      if (p.strategy === 'mean') {
        if (!inPosition && rsiVals[i] < Math.min(p.rsiBuy, 45) && price > slowMa[i]) return 'buy';
        if (inPosition && (rsiVals[i] > 62 || price < slowMa[i])) return 'sell';
      }
      return null;
    }

    function runBacktest() {
      const p = getParams();
      if (candles.length < Math.max(p.slow, p.rsiPeriod) + 5) {
        alert('数据太少，无法计算策略指标。');
        return;
      }
      const closes = candles.map(x => x.close);
      const highs = candles.map(x => x.high);
      const lows = candles.map(x => x.low);
      const fastMa = sma(closes, p.fast);
      const slowMa = sma(closes, p.slow);
      const rsiVals = rsi(closes, p.rsiPeriod);
      let cash = p.capital;
      let coin = 0;
      let entryPrice = 0;
      let entryCost = 0;
      let inPosition = false;
      const trades = [];
      const equity = [];
      let peak = p.capital;
      let maxDrawdown = 0;

      for (let i = 1; i < candles.length; i++) {
        const markEquity = cash + coin * closes[i];
        equity.push(markEquity);
        peak = Math.max(peak, markEquity);
        maxDrawdown = Math.min(maxDrawdown, (markEquity - peak) / peak);
        if (!fastMa[i] || !slowMa[i] || !rsiVals[i]) continue;
        const sig = signalAt(i, closes, highs, lows, fastMa, slowMa, rsiVals, p, inPosition, entryPrice);
        if (sig === 'buy' && !inPosition) {
          const fill = closes[i] * (1 + p.slippage);
          const spend = cash * p.risk;
          const feeCost = spend * p.fee;
          coin = (spend - feeCost) / fill;
          cash -= spend;
          entryPrice = fill;
          entryCost = spend;
          inPosition = true;
          trades.push({
            date: candles[i].date,
            action: 'BUY',
            price: fill,
            qty: coin,
            cash,
            equity: cash + coin * closes[i],
            pnl: null
          });
        } else if (sig === 'sell' && inPosition) {
          const fill = closes[i] * (1 - p.slippage);
          const gross = coin * fill;
          const feeCost = gross * p.fee;
          const proceeds = gross - feeCost;
          cash += proceeds;
          const pnl = proceeds - entryCost;
          trades.push({
            date: candles[i].date,
            action: 'SELL',
            price: fill,
            qty: coin,
            cash,
            equity: cash,
            pnl
          });
          coin = 0;
          entryPrice = 0;
          entryCost = 0;
          inPosition = false;
        }
      }

      const lastClose = closes[closes.length - 1];
      const finalEquity = cash + coin * lastClose;
      const sellTrades = trades.filter(x => x.action === 'SELL');
      const wins = sellTrades.filter(x => x.pnl > 0).length;
      const buyHold = (lastClose / closes[0] - 1) * 100;
      const totalReturn = (finalEquity / p.capital - 1) * 100;
      lastResult = { p, fastMa, slowMa, rsiVals, equity, trades, finalEquity, totalReturn, maxDrawdown: maxDrawdown * 100, winRate: sellTrades.length ? wins / sellTrades.length * 100 : 0, buyHold };
      render(lastResult);
    }

    function render(result) {
      els.mEquity.textContent = fmtUsd(result.finalEquity);
      els.mReturn.textContent = fmtPct(result.totalReturn);
      els.mReturn.className = result.totalReturn >= 0 ? 'positive' : 'negative';
      els.mDrawdown.textContent = `${result.maxDrawdown.toFixed(2)}%`;
      els.mDrawdown.className = 'negative';
      els.mWin.textContent = `${result.winRate.toFixed(1)}%`;
      els.mTrades.textContent = String(result.trades.length);
      els.mHold.textContent = fmtPct(result.buyHold);
      els.mHold.className = result.buyHold >= 0 ? 'positive' : 'negative';
      renderNotes(result);
      renderTrades(result.trades);
      drawChart(result);
      els.status.textContent = `${candles[0].date} 至 ${candles[candles.length - 1].date}，共 ${candles.length} 根 K 线。`;
    }

    function renderNotes(result) {
      const names = {
        maRsi: ['快线上穿慢线，且 RSI 高于阈值时买入。', '快线跌破慢线或 RSI 转弱时卖出。'],
        breakout: ['价格突破前 N 根最高价，且短期均线强于长期均线时买入。', '价格跌破前 N 根最低价或趋势转弱时卖出。'],
        mean: ['RSI 低位且价格仍在长期均线之上时买入。', 'RSI 恢复到强势区或跌破长期均线时卖出。']
      };
      els.strategyNotes.innerHTML = names[result.p.strategy].map(x => `<li>${x}</li>`).join('') +
        `<li>手续费 ${fmtPct(result.p.fee * 100)}，滑点 ${fmtPct(result.p.slippage * 100)}，单次使用 ${Math.round(result.p.risk * 100)}% 现金。</li>`;
      const last = candles[candles.length - 1];
      const lastRsi = result.rsiVals[result.rsiVals.length - 1];
      const lastFast = result.fastMa[result.fastMa.length - 1];
      const lastSlow = result.slowMa[result.slowMa.length - 1];
      const latestTrade = result.trades[result.trades.length - 1];
      els.signalNotes.innerHTML = [
        `最新收盘价：${fmtUsd(last.close)}，RSI：${lastRsi ? lastRsi.toFixed(1) : '-'}`,
        `快线：${lastFast ? fmtUsd(lastFast) : '-'}，慢线：${lastSlow ? fmtUsd(lastSlow) : '-'}`,
        latestTrade ? `最近一次交易：${latestTrade.date} ${latestTrade.action}，价格 ${fmtUsd(latestTrade.price)}` : '当前参数没有产生交易。'
      ].map(x => `<li>${x}</li>`).join('');
    }

    function renderTrades(trades) {
      if (!trades.length) {
        els.tradeBody.innerHTML = `<tr><td class="empty" colspan="7">当前参数没有产生交易。</td></tr>`;
        return;
      }
      els.tradeBody.innerHTML = trades.map(t => `
        <tr>
          <td>${t.date}</td>
          <td><span class="tag ${t.action === 'BUY' ? 'buy' : 'sell'}">${t.action}</span></td>
          <td>${fmtUsd(t.price)}</td>
          <td>${fmtNum(t.qty, 6)}</td>
          <td>${fmtUsd(t.cash)}</td>
          <td>${fmtUsd(t.equity)}</td>
          <td class="${t.pnl == null ? '' : t.pnl >= 0 ? 'positive' : 'negative'}">${t.pnl == null ? '-' : fmtUsd(t.pnl)}</td>
        </tr>
      `).join('');
    }

    function drawChart(result) {
      const canvas = els.chart;
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * scale);
      canvas.height = Math.floor(rect.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);
      const pad = { l: 56, r: 46, t: 24, b: 36 };
      const plotW = w - pad.l - pad.r;
      const plotH = h - pad.t - pad.b;
      const closes = candles.map(x => x.close);
      const priceSeries = [closes, result.fastMa, result.slowMa].flat().filter(Number.isFinite);
      const minP = Math.min(...priceSeries) * .96;
      const maxP = Math.max(...priceSeries) * 1.04;
      const eq = result.equity.length ? result.equity : [result.p.capital];
      const minE = Math.min(...eq) * .96;
      const maxE = Math.max(...eq) * 1.04;
      const x = i => pad.l + (i / (candles.length - 1)) * plotW;
      const yP = v => pad.t + (1 - (v - minP) / (maxP - minP)) * plotH;
      const yE = (v, i) => pad.t + (1 - (v - minE) / (maxE - minE || 1)) * plotH;

      ctx.strokeStyle = '#22302b';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const yy = pad.t + plotH * i / 4;
        ctx.beginPath();
        ctx.moveTo(pad.l, yy);
        ctx.lineTo(w - pad.r, yy);
        ctx.stroke();
      }

      function line(series, color, yFn, startOffset = 0, width = 2) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        let moved = false;
        for (let i = 0; i < series.length; i++) {
          const v = series[i];
          if (!Number.isFinite(v)) continue;
          const xx = x(i + startOffset);
          const yy = yFn(v, i);
          if (!moved) {
            ctx.moveTo(xx, yy);
            moved = true;
          } else {
            ctx.lineTo(xx, yy);
          }
        }
        ctx.stroke();
      }

      line(closes, '#64d7e8', yP, 0, 2);
      line(result.fastMa, '#f5c45f', yP, 0, 1.5);
      line(result.slowMa, '#7aa8ff', yP, 0, 1.5);
      line(result.equity, '#55d387', yE, 1, 2);

      result.trades.forEach(t => {
        const i = candles.findIndex(c => c.date === t.date);
        if (i < 0) return;
        const xx = x(i);
        const yy = yP(t.price);
        ctx.fillStyle = t.action === 'BUY' ? '#55d387' : '#ff6b6b';
        ctx.beginPath();
        if (t.action === 'BUY') {
          ctx.moveTo(xx, yy - 8);
          ctx.lineTo(xx - 6, yy + 6);
          ctx.lineTo(xx + 6, yy + 6);
        } else {
          ctx.moveTo(xx, yy + 8);
          ctx.lineTo(xx - 6, yy - 6);
          ctx.lineTo(xx + 6, yy - 6);
        }
        ctx.closePath();
        ctx.fill();
      });

      ctx.fillStyle = '#98aaa1';
      ctx.font = '12px Inter, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(fmtUsd(maxP), 10, pad.t + 5);
      ctx.fillText(fmtUsd(minP), 10, h - pad.b);
      ctx.textAlign = 'right';
      ctx.fillText(fmtUsd(maxE), w - 8, pad.t + 5);
      ctx.fillText(fmtUsd(minE), w - 8, h - pad.b);
      ctx.textAlign = 'center';
      ctx.fillText(candles[0].date, pad.l, h - 12);
      ctx.fillText(candles[candles.length - 1].date, w - pad.r, h - 12);
    }

    function downloadTrades() {
      if (!lastResult) return;
      const rows = [['date','action','price','qty','cash','equity','pnl']]
        .concat(lastResult.trades.map(t => [t.date, t.action, t.price, t.qty, t.cash, t.equity, t.pnl ?? '']));
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'crypto-backtest-trades.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    els.csvFile.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        candles = parseCsv(reader.result);
        els.status.textContent = `已导入 ${candles.length} 条数据：${file.name}`;
        runBacktest();
      };
      reader.readAsText(file);
    });

    els.sampleBtn.addEventListener('click', () => {
      candles = makeSampleData();
      els.status.textContent = '已恢复内置 BTC 样本数据。';
      runBacktest();
    });

    els.clearBtn.addEventListener('click', () => {
      candles = makeSampleData();
      els.csvFile.value = '';
      runBacktest();
    });

    els.downloadBtn.addEventListener('click', downloadTrades);
    els.runBtn.addEventListener('click', runBacktest);
    window.addEventListener('resize', () => lastResult && drawChart(lastResult));

    [els.strategy, els.fast, els.slow, els.rsiPeriod, els.rsiBuy, els.capital, els.risk, els.fee, els.slippage, els.stop, els.take]
      .forEach(el => el.addEventListener('change', runBacktest));

    runBacktest();
  </script>
</body>
</html>
